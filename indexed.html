<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>shekan - متجرك الشامل</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;text-align:center}
.header{background:#ff9900;color:#111;padding:20px;font-size:28px;font-weight:bold}
.btn{background:#ff9900;color:#111;border:none;padding:15px 30px;font-size:18px;border-radius:10px;cursor:pointer;margin:10px}
.products{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;padding:20px}
.card{background:#222;border-radius:10px;padding:15px;width:200px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
#admin{padding:20px;background:#222;margin:20px;display:none}
input{padding:10px;margin:5px;width:80%;border-radius:5px;border:none}
</style>
</head>
<body>

<div class="header">One Stop Shop shekan</div>
<p>اهلا بيكي في متجرنا</p>
<button class="btn" onclick="showProducts()">تسوق الان</button>
<button class="btn" onclick="showAdmin()">لوحة التحكم</button>

<div id="products" class="products"></div>

<div id="admin">
<h2>اضافة منتج جديد</h2>
<input id="pname" placeholder="اسم المنتج"><br>
<input id="pprice" placeholder="السعر"><br>
<input id="pimg" placeholder="رابط الصورة"><br>
<button class="btn" onclick="addProduct()">اضف المنتج</button>
</div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [
  {name:"موبايل سامسونج", price:"12000 جنيه", img:"https://via.placeholder.com/200"},
  {name:"سماعة بلوتوث", price:"800 جنيه", img:"https://via.placeholder.com/200"}
];

function showProducts(){
  document.getElementById('admin').style.display='none';
  let html='';
  products.forEach(p=>{
    html += `<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p>${p.price}</p><button class="btn">اشتري الان</button></div>`;
  });
  document.getElementById('products').innerHTML = html;
}

function showAdmin(){
  document.getElementById('products').innerHTML='';
  document.getElementById('admin').style.display='block';
}

function addProduct(){
  let name = document.getElementById('pname').value;
  let price = document.getElementById('pprice').value;
  let img = document.getElementById('pimg').value;
  products.push({name, price, img});
  localStorage.setItem('products', JSON.stringify(products));
  alert('تم اضافة المنتج!');
  document.getElementById('pname').value='';
  document.getElementById('pprice').value='';
  document.getElementById('pimg').value='';
}
</script>
</body>
</html>
